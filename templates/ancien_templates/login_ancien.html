<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion — Tickets marchés</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/css/app.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center" style="min-height:100vh;">
  <div class="container" style="max-width:420px;">
    <div class="card p-4">
      <h1 class="h4 mb-1">Tickets marchés publics</h1>
      <p class="text-muted">Aucun cash chez le collecteur. Paiement Orange Money uniquement.</p>
      <form method="post">{% csrf_token %}
        {% load crispy_forms_tags %}
        {{ form|crispy }}
        <button class="btn btn-success w-100">Connexion</button>
      </form>
    </div>
  </div>
</body>
</html>
