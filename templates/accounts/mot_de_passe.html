{% extends "index.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div class="row small-spacing">
  <div class="col-md-6 col-md-offset-3 col-sm-8 col-sm-offset-2 col-xs-12">
    <div class="box-content card">
      <h4 class="box-title bg-warning"><i class="ico fa fa-lock"></i>Changer mon mot de passe</h4>
      <div class="card-content">
        <p style="color:#7a869a;">{{ user.get_full_name|default:user.username }} · {{ user.get_role_display }}</p>
        {% for message in messages %}
        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}">{{ message }}</div>
        {% endfor %}
        <form method="post">{% csrf_token %}
          {{ form|crispy }}
          <button type="submit" class="btn btn-primary waves-effect waves-light">Enregistrer</button>
          <a class="btn btn-default" href="{% url 'accounts:profil' %}">Annuler</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
